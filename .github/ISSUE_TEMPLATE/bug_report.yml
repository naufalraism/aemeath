name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest program (route + input struct) that shows the problem.
      render: go
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Aemeath version or commit
    validations: { required: true }
  - type: input
    id: go
    attributes:
      label: Go version and OS
      placeholder: "go1.27.3 linux/amd64"
    validations: { required: true }
