name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Aemeath to do?
      description: Sketch the API you would like to write.
      render: go
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
