name: golangci-lint
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # keep the Go version in sync with go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8 # v8 of the action is for golangci-lint v2
        with:
          version: v2.14.0 # must support the Go version in go.mod
          args: --timeout=5m
