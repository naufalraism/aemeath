name: golangci-lint
on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x' # Kunci versi Go secara eksplisit
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8 # Action v8 untuk golangci-lint v2
        with:
          version: v2.14.0 # Versi golangci-lint yang mendukung Go 1.27
          args: --timeout=5m
